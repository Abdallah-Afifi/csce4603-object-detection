name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install opencv-python-headless numpy matplotlib scikit-learn pyyaml pytest
      - name: Tests
        run: python -m pytest -q
